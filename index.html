<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Corazón Morado Animado</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #000;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>
    <canvas id="heartCanvas"></canvas>

    <script>
        // Configuración inicial
        const canvas = document.getElementById('heartCanvas');
        const ctx = canvas.getContext('2d');
        let width = canvas.width = window.innerWidth;
        let height = canvas.height = window.innerHeight;

        // Colores en tonos morados
        const colors = {
            darkPurple: 'rgba(80, 0, 120, 0.8)',
            purple: 'rgba(128, 0, 255, 0.8)',
            lightPurple: 'rgba(180, 100, 255, 0.8)',
            lavender: 'rgba(200, 150, 255, 0.8)',
            pinkPurple: 'rgba(255, 100, 255, 0.8)',
            electricPurple: 'rgba(191, 0, 255, 0.8)'
        };

        // Función para generar la posición del corazón
        function heartPosition(rad) {
            const x = Math.pow(Math.sin(rad), 3);
            const y = -(15 * Math.cos(rad) - 5 * Math.cos(2 * rad) - 2 * Math.cos(3 * rad) - Math.cos(4 * rad));
            return [x, y];
        }

        // Función para escalar y trasladar puntos
        function scaleAndTranslate(pos, sx, sy, dx, dy) {
            return [dx + pos[0] * sx, dy + pos[1] * sy];
        }

        // Generar puntos del corazón
        const pointsOrigin = [];
        const dr = 0.03;
        for (let i = 0; i < Math.PI * 2; i += dr) {
            pointsOrigin.push(scaleAndTranslate(heartPosition(i), 210, 13, 0, 0));
        }
        for (let i = 0; i < Math.PI * 2; i += dr) {
            pointsOrigin.push(scaleAndTranslate(heartPosition(i), 150, 9, 0, 0));
        }
        for (let i = 0; i < Math.PI * 2; i += dr) {
            pointsOrigin.push(scaleAndTranslate(heartPosition(i), 90, 5, 0, 0));
        }
        const heartPointsCount = pointsOrigin.length;

        // Crear partículas
        const particles = [];
        const traceCount = 10;
        const particleCount = 500;

        for (let i = 0; i < particleCount; i++) {
            const purpleTypes = [
                colors.darkPurple,
                colors.purple,
                colors.lightPurple,
                colors.pinkPurple,
                colors.electricPurple
            ];
            const color = purpleTypes[Math.floor(Math.random() * purpleTypes.length)];

            particles.push({
                x: Math.random() * width,
                y: Math.random() * height,
                vx: 0,
                vy: 0,
                speed: Math.random() + 5,
                q: Math.floor(Math.random() * heartPointsCount),
                D: 2 * (Math.floor(Math.random() * 2)) - 1,
                force: 0.2 * Math.random() + 0.7,
                color: color,
                trace: []
            });

            // Inicializar trazas
            for (let j = 0; j < traceCount; j++) {
                particles[i].trace.push({ x: particles[i].x, y: particles[i].y });
            }
        }

        // Crear destellos
        const sparks = [];

        class Spark {
            constructor(x, y) {
                this.x = x || Math.random() * width;
                this.y = y || Math.random() * height;
                this.vx = Math.random() * 6 - 3;
                this.vy = Math.random() * 6 - 3;
                this.life = 1.0;
                this.maxLife = Math.random() * 0.5 + 0.5;
                this.size = Math.random() * 4 + 2;
                this.color = `rgba(200, 150, 255, ${this.life})`;
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.life -= 0.02;
                this.vx *= 0.95;
                this.vy *= 0.95;
                this.color = `rgba(200, 150, 255, ${this.life})`;
            }

            isAlive() {
                return this.life > 0;
            }
        }

        // Función de pulsación
        function pulse(kx, ky) {
            const targetPoints = [];
            for (let i = 0; i < pointsOrigin.length; i++) {
                targetPoints.push([
                    kx * pointsOrigin[i][0] + width / 2,
                    ky * pointsOrigin[i][1] + height / 2
                ]);
            }
            return targetPoints;
        }

        // Función para crear destellos
        function createSparks(count, x, y) {
            for (let i = 0; i < count; i++) {
                sparks.push(new Spark(x, y));
            }
        }

        // Variables de animación
        let time = 0;
        const timeDelta = 0.01;
        let pulseCounter = 0;
        const traceK = 0.6;

        // Bucle de animación
        function animate() {
            requestAnimationFrame(animate);

            // Calcular pulsación
            const n = -Math.cos(time);
            const kx = (1 + n) * 0.5;
            const ky = (1 + n) * 0.5;
            const targetPoints = pulse(kx, ky);

            // Actualizar tiempo
            time += (Math.sin(time) < 0 ? 9 : (n > 0.8 ? 0.2 : 1)) * timeDelta;

            // Crear destellos en el pico de la pulsación
            pulseCounter++;
            if (pulseCounter > 30 && n > 0.9) {
                for (let i = 0; i < 10; i++) {
                    const idx = Math.floor(Math.random() * targetPoints.length);
                    const [x, y] = targetPoints[idx];
                    createSparks(3, x, y);
                }
                pulseCounter = 0;
            }

            // Destellos aleatorios
            if (Math.random() < 0.1) {
                createSparks(2);
            }

            // Fondo con desvanecimiento
            ctx.fillStyle = 'rgba(0, 0, 0, 0.1)';
            ctx.fillRect(0, 0, width, height);

            // Actualizar y dibujar partículas
            particles.forEach(particle => {
                const q = targetPoints[particle.q];
                const dx = particle.trace[0].x - q[0];
                const dy = particle.trace[0].y - q[1];
                const length = Math.sqrt(dx * dx + dy * dy);

                if (length < 20) {
                    if (Math.random() > 0.95) {
                        particle.q = Math.floor(Math.random() * heartPointsCount);
                    } else {
                        if (Math.random() > 0.99) {
                            particle.D *= -1;
                        }
                        particle.q = (particle.q + particle.D) % heartPointsCount;
                        if (particle.q < 0) {
                            particle.q += heartPointsCount;
                        }
                    }
                }

                if (length > 0) {
                    particle.vx += (-dx / length) * particle.speed * 0.5;
                    particle.vy += (-dy / length) * particle.speed * 0.5;
                }

                particle.trace[0].x += particle.vx;
                particle.trace[0].y += particle.vy;

                particle.vx *= particle.force;
                particle.vy *= particle.force;

                // Actualizar trazas
                for (let k = 0; k < particle.trace.length - 1; k++) {
                    const current = particle.trace[k];
                    const next = particle.trace[k + 1];
                    next.x -= traceK * (next.x - current.x);
                    next.y -= traceK * (next.y - current.y);
                }

                // Dibujar partículas
                particle.trace.forEach((trace, index) => {
                    const alphaScale = 1.0 - (index / particle.trace.length) * 0.8;
                    const sizeScale = 1.0 - (index / particle.trace.length) * 0.5;
                    const size = Math.max(1, 3 * sizeScale);

                    ctx.beginPath();
                    ctx.arc(trace.x, trace.y, size, 0, Math.PI * 2);
                    ctx.fillStyle = particle.color.replace('0.8', alphaScale.toString());
                    ctx.fill();
                });
            });

            // Actualizar y dibujar destellos
            sparks.forEach((spark, index) => {
                spark.update();
                if (!spark.isAlive()) {
                    sparks.splice(index, 1);
                } else {
                    ctx.beginPath();
                    ctx.arc(spark.x, spark.y, spark.size, 0, Math.PI * 2);
                    ctx.fillStyle = spark.color;
                    ctx.fill();

                    // Efecto de halo
                    ctx.beginPath();
                    ctx.arc(spark.x, spark.y, spark.size * 2, 0, Math.PI * 2);
                    ctx.strokeStyle = spark.color.replace('1)', '0.5)');
                    ctx.lineWidth = 1;
                    ctx.stroke();
                }
            });
        }

        // Iniciar animación
        animate();

        // Redimensionar canvas
        window.addEventListener('resize', () => {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        });
    </script>
</body>
</html>
